[theme]
base = "light"
primaryColor = "#000000"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f5f7"
textColor = "#1d1d1f"
font = "sans serif"

[server]
# Headless skips Streamlit's first-run "Email:" prompt, which otherwise blocks the
# server from starting until someone presses Enter in the terminal.
headless = true
port = 8501
# Only reachable from this computer. Change to "0.0.0.0" to demo from another
# device on the same Wi-Fi.
address = "localhost"

[browser]
gatherUsageStats = false
