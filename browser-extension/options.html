<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Senti-Q for X: settings</title>
  <style>
    body { font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: #0a0a0a; margin: 32px; max-width: 520px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    p { color: #525252; margin: 0 0 22px; }
    label { display: block; font-weight: 600; margin: 18px 0 6px; }
    input, select { width: 100%; box-sizing: border-box; padding: 10px 14px; border: 1px solid #d4d4d4; border-radius: 10px; font: inherit; background: #fff; }
    small { display: block; color: #737373; margin-top: 6px; }
    button { margin-top: 22px; padding: 9px 20px; border: 0; border-radius: 999px; background: #0a0a0a; color: #fff; font: inherit; cursor: pointer; }
    #saved { margin-left: 10px; color: #525252; }
  </style>
</head>
<body>
  <h1>Senti-Q for X</h1>
  <p>Settings for reading the reactions to posts on X.</p>

  <label for="appUrl">Senti-Q address</label>
  <input id="appUrl" type="url" placeholder="http://localhost:8501">
  <small>Where your Senti-Q app runs. Keep the default unless you host it somewhere else.</small>

  <label for="maxReplies">Replies to read per post</label>
  <select id="maxReplies">
    <option value="50">50 (quickest)</option>
    <option value="100">100 (recommended)</option>
    <option value="200">200</option>
    <option value="300">300 (slowest)</option>
  </select>
  <small>More replies give steadier percentages but take longer to scroll through and score.</small>

  <button id="save">Save</button><span id="saved"></span>
  <script src="options.js"></script>
</body>
</html>
